[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The dependencies in this config have no transitive dependencies.
anyhow = "1.0.104"
env_logger = { version = "0.11.11", default-features = false }
log = "0.4.34"
pico-args = { version = "0.5.0", features = [
    "eq-separator",
    "short-space-opt",
    "combined-flags",
] }
xshell = "0.2.7"

[workspace]
